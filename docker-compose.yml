# Local / VM: single container = OPA + optional built-in DataHub sync.
#
#   cp .env.example .env
#   # optional: set DATAHUB_GMS_URL (+ DATAHUB_TOKEN) in .env
#   docker compose up -d --build
#
# Trino ([trinostate](https://github.com/StanDmitrievAiven/trinostate)) env:
#   OPA_POLICY_URI=https://host/v1/data/trino/allow
#   OPA_POLICY_BATCHED_URI=https://host/v1/data/trino/batch

services:
  opa:
    build: .
    restart: unless-stopped
    environment:
      PORT: "${PORT:-8181}"
      OPA_LOG_LEVEL: "${OPA_LOG_LEVEL:-info}"
      DATAHUB_GMS_URL: "${DATAHUB_GMS_URL:-}"
      DATAHUB_TOKEN: "${DATAHUB_TOKEN:-}"
      SYNC_INTERVAL_SECONDS: "${SYNC_INTERVAL_SECONDS:-120}"
    ports:
      - "${OPA_PUBLISH:-8181}:${PORT:-8181}"
    volumes:
      - ./data:/data
      - ./policies:/policies:ro
